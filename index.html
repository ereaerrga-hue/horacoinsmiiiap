<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HoraCoins</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">

    <style> body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #000000, #444444);
        color: #fff;
        font-family: sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    </style>

    <style>
        .button-inner {
            transition: transform 0.1s ease;
        }

        .button-cash:active .button-inner {
            transform: scale(0.9);
        }

        .button-cash{

            animation: upDown 3s 0s infinite ease-in-out;
        }

        @keyframes upDown {
            0%, 100% { transform: translateY(0);}
            50%      { transform: translateY(-20px);}
        }
    </style>

    <style>
        .clik{
            position: relative;
            top: -350px;
            left: -50px;
            color: dimgrey;
            border-radius: 50px;
            font-family: "Calibri",serif;
            touch-action: manipulation;
        }

    </style>

    <style>
        .you-chek {
            position: relative;
            top: -380px;
            left: 53px;
            color: dimgray;
            font-family: "Calibri",serif;
        }
    </style>

    <style>
        .Chek-img {
            position: relative;
            top: -353px;
            left: -55px;
            height: 30px;
        }
    </style>

    <style>
        .button-shop {
            position: relative;
            top: -260px;
            left: -270px;
            height: 90px;
            width: 90px;
            border-radius: 20%;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);

            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow:
                    inset 0 1px 1px rgba(255, 255, 255, 0.4),
                    inset 0 -1px 1px rgba(255, 255, 255, 0.05),
                    0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .button-shop {
            transition: transform 0.1s ease;
        }

        .button-shop:active {
            transform: scale(0.9);
        }

    </style>

    <style>
        /* ---- ФИКС АДАПТИВНОСТИ (дополнительный слой) ---- */
        :root {
            --tg-viewport-height: 100vh;
        }

        html, body {
            height: var(--tg-viewport-height);
            overflow: hidden;
            box-sizing: border-box;
        }

        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .button-cash img.button-inner {
            height: auto !important;
            width: min(70vw, 320px);
        }
    </style>

</head>
<body>

<div class="you-chek">
    <h4>Твой счёт</h4>
</div>

<div class="clik">
    <h2><span id="counter">0.000000000</span></h2>
</div>

<div class="button-cash">
    <button id="btn" style="border: none; width: 1px; height: 1px; position: relative; top: 220px; left: -312px; background: transparent">
        <img class="button-inner" style="height: 400px" src="https://www.pngarts.com/files/3/Silver-Coin-Free-PNG-Image.png" alt="Cash">
    </button>
</div>

<img class="Chek-img" src="https://www.pngarts.com/files/3/Silver-Coin-Free-PNG-Image.png" alt="Chek">

<button class="button-shop">

</button>

<script>
    let count = 0.000000000;

    const btn = document.getElementById('btn');
    const counter = document.getElementById('counter');
    const STEP =1e9;

    btn.addEventListener('click', () => {
        count++;
        counter.innerText = (count / STEP).toFixed(9);

    });
</script>

<script>
    /* global Telegram */
    /* ---- ФИКС TELEGRAM VIEWPORT (дополнительный скрипт) ---- */
    (function () {
        const w = /** @type {any} */ (window);
        const tg = w.Telegram && w.Telegram.WebApp;
        if (!tg) return;

        tg.ready();
        tg.expand();

        const syncVh = function () {
            document.documentElement.style.setProperty(
                '--tg-viewport-height',
                tg.viewportHeight + 'px'
            );
        };
        syncVh();
        tg.onEvent('viewportChanged', syncVh);
    })();
</script>

</body>
<footer>

</footer>
</html>
